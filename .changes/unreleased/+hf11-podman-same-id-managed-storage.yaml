kind: Fixed
body: Preserve the invoking account's primary UID/GID and operator access to managed config, data, and application output on local rootless Podman. Apply the same mapping to transient commands, controlled sessions without granted endpoints, and Compose recreation without changing existing file ownership or permissions. Network-enabled Podman controlled sessions remain unsupported; network identity and fixed-address checks remain enforced. Separate service accounts require a matching engine or a rootful engine; host supplementary-group equivalence remains unsupported.
