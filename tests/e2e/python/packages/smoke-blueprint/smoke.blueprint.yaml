blueprint:
  schema: 1
  version: 0.1.0
  requires_reploy: ">=0.4.8.dev1"
  compatibility:
    platforms: [linux/amd64, linux/arm64]

environment:
  id: smoke-app
  base:
    image: python:3.11-slim
  applications:
    application:
      packages:
        python:
          requirements: [smoke-suite]
      executables:
        server:
          source: python
          binary: smoke-server
      options:
        imap:
          description: Install the smoke IMAP plugin.
          packages:
            python:
              requirements: [smoke-imap]
  allow_concurrent: auto
  terminal:
    color_env: SMOKE_COLOR
  mounts:
    config:
      target: /conf
      writable: true
      update_policy: preserve
    data:
      target: /data
      writable: true
      update_policy: preserve
  commands:
    serve:
      executable: application.server
      argv:
        - serve
        - --host
        - "{{ reploy.workload.endpoints.https.bind.address }}"
        - --port
        - "{{ reploy.workload.endpoints.https.bind.port }}"
    config_check:
      executable: application.server
      trigger: [config, check]
      native_command: true
      deployed_command: true
      forward_flags: [--live]
      argv: [config, check]
  workload:
    command: serve
    endpoints:
      https:
        scheme: https
        port: 8075
        readiness:
          path: /_health_
          tls_verify: false
    runtime:
      before_start:
        - actions:
            - environment: [config, check]
      after_start:
        - requires:
            endpoints: [https]
          actions:
            - environment: [config, check, --live]
      before_stop:
        - actions:
            - environment: [config, check, --live]
      after_stop:
        - actions:
            - environment: [config, check]
  install:
    success:
      lines:
        - "server url: {{ environment.workload.endpoints.https.scheme }}://{{ reploy.workload.endpoints.https.publish.address }}:{{ reploy.workload.endpoints.https.publish.port }}"

docker:
  mounts:
    config:
      extends: environment.mounts.config
      mode: managed-bind
      source: conf
    data:
      extends: environment.mounts.data
      mode: managed-bind
      source: data
  workload:
    endpoints:
      https:
        extends: environment.workload.endpoints.https
        bind:
          address: 0.0.0.0
        publish:
          address: 127.0.0.1
          staging: 18075
          deployed: 19075
