name: demo-staging-abcd
services:
    environment:
        image: reploy/demo:staging
        pull_policy: never
        container_name: demo-staging-abcd
        user: "0:0"
        group_add: []
        cap_drop:
            - ALL
        cap_add:
            - NET_ADMIN
            - SETGID
            - SETPCAP
            - SETUID
        security_opt:
            - no-new-privileges:true
            - seccomp=builtin
        entrypoint: [/opt/reploy/runtime/reploy-probe]
        command: [sandbox-exec, --uid, "501", --gid, "20", --public, deny, --local, deny, --inbound-tcp, "8080", --, /opt/reploy/python/bin/demo, serve]
        volumes:
            - type: bind
              source: /tmp/demo/conf
              target: /config
              read_only: true
        ports:
            - 127.0.0.1:18080:8080
        read_only: true
        environment:
            HOME: /mnt/reploy-home
            TMPDIR: /mnt/reploy-home
        tmpfs:
            - /mnt/reploy-home:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=501,gid=20
networks:
    default:
        name: demo-staging-abcd
