name: Publish
run-name: Publish Reploy ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must match VERSION on the selected ref, without a v prefix).
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Check requested release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out release version
        uses: actions/checkout@v4
        with:
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false

      - name: Validate requested release version and available tag
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$version" || "$version" != "$REQUESTED_VERSION" ]]; then
            echo "Requested release version '$REQUESTED_VERSION' does not match VERSION '$version'." >&2
            exit 1
          fi

          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release already exists: $tag" >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Git tag already exists: $tag" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *".dev"* || "$version" == *"a"* || "$version" == *"b"* || "$version" == *"rc"* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  ci:
    name: CI gate
    needs: version
    uses: ./.github/workflows/ci.yml

  integration:
    name: Integration smoke gate
    needs: version
    uses: ./.github/workflows/integration.yml
    with:
      macos_runner: macos-15-intel
      portable_tool_checks_in_ci: true

  prepare:
    name: Build and validate release artifacts
    needs: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      prerelease: ${{ needs.version.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select shared Go build cache
        shell: bash
        run: echo "GOCACHE=$RUNNER_TEMP/reploy-go-cache" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip build hatchling editables twine

      - name: Run Go tests
        run: go test ./...

      - name: Build release distributions
        run: tools/build_release_dists --outdir dist-publish --clean --no-isolation

      - name: Run CLI integration smoke
        run: python tools/e2e/smoke --runtime --reploy dist-publish/linux-amd64/reploy

      - name: Stage PyPI distributions
        run: |
          set -euo pipefail
          mkdir -p pypi-dists
          cp dist-publish/*.whl pypi-dists/
          python -m twine check pypi-dists/*

      - name: Stage GitHub Release binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          install -m 0755 dist-publish/linux-amd64/reploy release-assets/reploy-linux-amd64
          install -m 0755 dist-publish/linux-arm64/reploy release-assets/reploy-linux-arm64
          install -m 0755 dist-publish/darwin-amd64/reploy release-assets/reploy-darwin-amd64
          install -m 0755 dist-publish/darwin-arm64/reploy release-assets/reploy-darwin-arm64
          install -m 0755 dist-publish/windows-amd64/reploy.exe release-assets/reploy-windows-amd64.exe
          install -m 0755 dist-publish/windows-arm64/reploy.exe release-assets/reploy-windows-arm64.exe
          (cd release-assets && sha256sum reploy-* > SHA256SUMS)
          python tools/build_release_notes \
            --version "$VERSION" \
            --prerelease "$PRERELEASE" \
            --out release-notes.md

      - name: Upload release artifacts for review
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          if-no-files-found: error
          path: |
            pypi-dists/
            release-assets/
            release-notes.md

  publish:
    name: Approve and publish PyPI and GitHub Release
    needs: [ci, integration, prepare]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download reviewed release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}

      - name: Verify downloaded binary checksums
        run: cd release-assets && sha256sum --check SHA256SUMS

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dists
          print-hash: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            "$TAG"
            release-assets/reploy-linux-amd64
            release-assets/reploy-linux-arm64
            release-assets/reploy-darwin-amd64
            release-assets/reploy-darwin-arm64
            release-assets/reploy-windows-amd64.exe
            release-assets/reploy-windows-arm64.exe
            release-assets/SHA256SUMS
            --target "$GITHUB_SHA"
            --title "Reploy $VERSION"
            --notes-file release-notes.md
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
