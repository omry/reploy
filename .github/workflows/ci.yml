name: PR339 DNS diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dns:
    name: DNS diagnostic (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pinned-image DNS and APT behavior
        run: python3 tools/ci/pr339_dns_diagnostic.py
      - name: Retain diagnostic observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr339-dns-diagnostic-${{ matrix.arch }}
          path: ${{ runner.temp }}/pr339-dns-diagnostic/commands.json
          if-no-files-found: error
