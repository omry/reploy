name: Integration

on:
  workflow_dispatch:
    inputs:
      macos_runner:
        description: GitHub-hosted macOS runner for Docker integration.
        type: string
        default: macos-15-intel
  workflow_call:
    inputs:
      macos_runner:
        description: GitHub-hosted macOS runner for Docker integration.
        type: string
        default: macos-15-intel
      portable_tool_checks_in_ci:
        description: Caller requires ci.yml's portable-tool matrices and direct controlled-session contract before publication.
        type: boolean
        default: false

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cli-integration:
    name: CLI runtime integration (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            runner: ubuntu-latest
            persistent_install: true
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            persistent_install: true
          - name: macOS amd64
            runner: ${{ inputs.macos_runner || 'macos-15-intel' }}
            persistent_install: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select shared Go build cache
        shell: bash
        run: echo "GOCACHE=$RUNNER_TEMP/reploy-go-cache" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install maintainer tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install nox

      - name: Install Docker runtime on macOS
        if: runner.os == 'macOS'
        run: |
          tool_dir="$RUNNER_TEMP/reploy-macos-docker"
          python tools/ci/install_macos_docker.py --prefix "$tool_dir"
          export PATH="$tool_dir/bin:$PATH"
          echo "$tool_dir/bin" >> "$GITHUB_PATH"
          mkdir -p ~/.docker/cli-plugins
          ln -sf "$tool_dir/libexec/docker/cli-plugins/docker-buildx" ~/.docker/cli-plugins/docker-buildx
          ln -sf "$tool_dir/libexec/docker/cli-plugins/docker-compose" ~/.docker/cli-plugins/docker-compose
          sw_vers
          uname -a
          sysctl -n kern.hv_support || true
          colima version
          limactl --version
          # Leave resources for the host; Intel runners have 4 CPUs/14 GB.
          vm_cpu=2
          vm_memory=4
          if [[ "$(uname -m)" == x86_64 ]]; then
            vm_cpu=3
            vm_memory=8
          fi
          colima start --runtime docker --vm-type vz --mount-type virtiofs --cpu "$vm_cpu" --memory "$vm_memory" --disk 20
          colima status
          docker info
          docker buildx version
          docker compose version
          docker run --rm -v "$PWD:/workspace:ro" alpine:3.22 test -f /workspace/go.mod

      - name: Preload shared Docker integration fixture
        run: docker pull debian:bookworm-slim

      - name: Preload provider Docker integration fixture
        if: matrix.name == 'Linux amd64'
        run: |
          docker pull python:3.13-slim
          docker pull python:3.12-slim

      - name: Preload pinned Chromium launch fixture
        if: matrix.name == 'Linux amd64'
        run: docker pull --platform linux/amd64 docker.io/library/ubuntu@sha256:7b202b0e2e0028c6250f5fcf41d04df492d145a1654c6995a6553f0c1f6f1960

      - name: Run provider Docker integration tests
        if: matrix.name == 'Linux amd64'
        env:
          REPLOY_DOCKER_INTEGRATION: "1"
        run: >-
          go test -timeout 10m ./internal/dockerdeploy
          -run '^(TestTypedMaterializationLayerDockerIntegration|TestPreparedPythonGraphDockerIntegration|TestPreparedPythonGraphDockerIntegrationPTD2337NeutralBindings|TestPreparedPythonGraphDockerIntegrationPTD2337PlaywrightBinding|TestPreparedAPTPythonGraphDockerIntegration|TestPreparedAPTPythonTwoInterpreterDockerIntegration|TestPreparedAPTPythonNativeLibraryDockerIntegration|TestPythonResolverWheelIntegration)$'

      - name: Prove selected Chromium launches as non-root
        if: matrix.name == 'Linux amd64'
        env:
          REPLOY_DOCKER_INTEGRATION: "1"
        run: >-
          go test -count=1 -timeout 30m ./internal/dockerdeploy
          -run '^TestPortableChromiumUbuntu2604DockerIntegration$'

      - name: Prove representative cases and complete Java and Playwright matrices with current evidence
        if: matrix.name == 'Linux amd64' && !inputs.portable_tool_checks_in_ci
        env:
          REPLOY_DOCKER_INTEGRATION: "1"
          REPLOY_PORTABLE_TOOL_EVIDENCE_DIR: ${{ runner.temp }}/portable-tool-evidence
        run: >-
          go test -v -count=1 -timeout 30m ./internal/dockerdeploy
          -run '^(TestPortableToolRepresentativeDockerIntegration|TestPortableToolJavaMatrixDockerIntegration|TestPortableToolPlaywrightMatrixDockerIntegration)$'

      - name: Prove representative portable-tool cases with current evidence
        if: matrix.name == 'Linux amd64' && inputs.portable_tool_checks_in_ci
        env:
          REPLOY_DOCKER_INTEGRATION: "1"
          REPLOY_PORTABLE_TOOL_EVIDENCE_DIR: ${{ runner.temp }}/portable-tool-evidence
        run: >-
          go test -v -count=1 -timeout 30m ./internal/dockerdeploy
          -run '^TestPortableToolRepresentativeDockerIntegration$'

      - name: Retain external portable-tool observations
        if: always() && matrix.name == 'Linux amd64'
        uses: actions/upload-artifact@v4
        with:
          name: portable-tool-evidence-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/portable-tool-evidence/*.json
            ${{ runner.temp }}/portable-tool-evidence/.reploy/provider-store/validation/

      - name: Run private workload isolation integration tests
        env:
          REPLOY_DOCKER_INTEGRATION: "1"
        run: >-
          go test -timeout 10m ./internal/dockerdeploy
          -run '^(TestPrivateWorkloadEnvironmentDockerIntegrationMasksFilesAndInjectsValues|TestPrivateRuntimeMasksDockerIntegrationProtectTransientContainer|TestPrivateWorkloadEnvironmentRealDockerIsolation)$'

      - name: Run application sandbox integration tests
        env:
          REPLOY_DOCKER_INTEGRATION: "1"
        run: >-
          go test -timeout 15m ./internal/dockerdeploy
          -run '^(TestTransientCommandDockerIntegrationEnforcesIdentityAndKernelBaseline|TestApplicationStartupVerifierDockerIntegration|TestApplicationNetworkPolicyDockerIntegration)$'

      - name: Run controlled-session integration tests
        if: runner.os == 'Linux'
        env:
          REPLOY_DOCKER_INTEGRATION: "1"
        run: >-
          go test -timeout 15m ./internal/dockerdeploy
          -run '^(TestControlledSessionSupervisorDockerIntegration|TestControlledSessionNetworkingDockerIntegration|TestControlledSessionControllerPackageDockerIntegration)$'

      - name: Install pinned controlled-session browser fixtures
        if: matrix.name == 'Linux amd64' && !inputs.portable_tool_checks_in_ci
        run: |
          fixture=testdata/controlled-session/controlled-session-contract-v1.json
          playwright_url=$(jq -r '.packages[] | select(.name == "playwright") | .url' "$fixture")
          playwright_sha256=$(jq -r '.packages[] | select(.name == "playwright") | .sha256' "$fixture")
          playwright_core_url=$(jq -r '.packages[] | select(.name == "playwright-core") | .url' "$fixture")
          playwright_core_sha256=$(jq -r '.packages[] | select(.name == "playwright-core") | .sha256' "$fixture")
          curl --fail --location --silent --show-error "$playwright_url" --output "$RUNNER_TEMP/playwright.tgz"
          curl --fail --location --silent --show-error "$playwright_core_url" --output "$RUNNER_TEMP/playwright-core.tgz"
          echo "$playwright_sha256  $RUNNER_TEMP/playwright.tgz" | sha256sum --check --strict
          echo "$playwright_core_sha256  $RUNNER_TEMP/playwright-core.tgz" | sha256sum --check --strict
          echo "REPLOY_PLAYWRIGHT_FIXTURE=$RUNNER_TEMP/playwright.tgz" >> "$GITHUB_ENV"
          echo "REPLOY_PLAYWRIGHT_CORE_FIXTURE=$RUNNER_TEMP/playwright-core.tgz" >> "$GITHUB_ENV"

      - name: Prove the direct controlled-session terminal and browser contract
        if: matrix.name == 'Linux amd64' && !inputs.portable_tool_checks_in_ci
        env:
          REPLOY_DOCKER_INTEGRATION: "1"
        run: >-
          go test -v -count=1 -timeout 15m ./internal/dockerdeploy
          -run '^TestReployControlledSessionContractDockerIntegration$'

      - name: Run CLI runtime integration
        if: ${{ matrix.persistent_install == false }}
        env:
          NO_UPDATE_NOTIFIER: "1"
          TMPDIR: ${{ runner.temp }}/
        run: nox -s cli-integration

      - name: Run CLI runtime and persistent install integration
        if: ${{ matrix.persistent_install == true }}
        env:
          NO_UPDATE_NOTIFIER: "1"
          TMPDIR: ${{ runner.temp }}/
        run: nox -s cli-integration -- --persistent-install

      - name: Dump macOS Docker runtime logs
        if: failure() && runner.os == 'macOS'
        run: |
          find ~/.colima -maxdepth 5 -type f -name "*.log" -print -exec tail -n 200 {} \; || true
          find ~/.lima -maxdepth 5 -type f -name "*.log" -print -exec tail -n 200 {} \; || true

      - name: Stop macOS Docker runtime
        if: always() && runner.os == 'macOS'
        run: colima delete --force || true

  apt-provider-integration:
    name: APT provider integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:bookworm-slim
            platform: linux/amd64
            failures: "1"
          - name: Debian 13
            image: debian:trixie-slim
            platform: linux/amd64
            failures: "0"
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            platform: linux/amd64
            failures: "0"
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            platform: linux/amd64
            failures: "0"
          - name: Debian 12 arm64
            image: debian:bookworm-slim
            platform: linux/arm64
            failures: "0"
          - name: Debian 12 arm/v7
            image: debian:bookworm-slim
            platform: linux/arm/v7
            failures: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Set up emulation for non-native APT images
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Pull representative APT image
        run: docker pull --platform ${{ matrix.platform }} ${{ matrix.image }}

      - name: Run combined APT provider integration scenario
        env:
          REPLOY_DOCKER_INTEGRATION: "1"
          REPLOY_APT_INTEGRATION_BASE: ${{ matrix.image }}
          REPLOY_APT_INTEGRATION_PLATFORM: ${{ matrix.platform }}
          REPLOY_APT_INTEGRATION_FAILURES: ${{ matrix.failures }}
        run: >-
          go test -timeout 15m ./internal/dockerdeploy
          -run '^(TestAPTResolverBaseProfileDockerIntegration|TestAPTResolverRepositoryFailureDockerIntegration|TestAPTResolverUpgradeDockerIntegration)$'
