blueprint:
  schema: 1
  version: 0.1.0
  requires_reploy: ">=0.5.1.dev1"
  compatibility:
    platforms: [linux/amd64, linux/arm64]

environment:
  id: omegaconf-inspector
  components:
    base:
      image: python:3.11-slim
    application:
      type: python
      requirements: [omegaconf-inspector]
      executables:
        inspector:
          binary: omegaconf-inspector
  allow_concurrent: auto
  mounts:
    config:
      target: /conf
      writable: true
      update_policy: preserve
    data:
      target: /data
      writable: true
      update_policy: preserve
  commands:
    serve:
      executable: application.inspector
      argv: [serve]
    config_init:
      executable: application.inspector
      trigger: [config, init]
      native_command: true
      forward_flags: [--force]
      argv: [config, init]
    config_check:
      executable: application.inspector
      trigger: [config, check]
      native_command: true
      deployed_command: true
      forward_flags: [--live]
      argv: [config, check]
    config_show:
      executable: application.inspector
      trigger: [config, show]
      native_command: true
      deployed_command: true
      argv: [config, show]
    project_list:
      executable: application.inspector
      trigger: [project, list]
      native_command: true
      deployed_command: true
      argv: [project, list]
    project_show:
      executable: application.inspector
      trigger: [project, show]
      native_command: true
      deployed_command: true
      argv: [project, show]
    version:
      executable: application.inspector
      trigger: [version]
      native_command: true
      deployed_command: true
      argv: [version]
  workload:
    command: serve
    endpoints:
      http:
        scheme: http
        port: 8076
        readiness:
          path: /_health_
    runtime:
      before_start:
        - actions:
            - environment: [config, check]
      after_start:
        - requires:
            endpoints: [http]
          actions:
            - environment: [config, check, --live]
  install:
    target:
      default_path: "{{ reploy.install_root }}/{{ environment.id }}"
    success:
      lines:
        - "inspector url: {{ environment.workload.endpoints.http.scheme }}://{{ reploy.workload.endpoints.http.publish.address }}:{{ reploy.workload.endpoints.http.publish.port }}"

docker:
  mounts:
    config:
      extends: environment.mounts.config
      mode: managed-bind
      source: conf
    data:
      extends: environment.mounts.data
      mode: managed-bind
      source: data
  workload:
    endpoints:
      http:
        extends: environment.workload.endpoints.http
        bind:
          address: 0.0.0.0
        publish:
          address: 127.0.0.1
          staging: 18076
          deployed: 19076
